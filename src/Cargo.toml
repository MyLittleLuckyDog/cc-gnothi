[package]
name = "cc-gnothi-mcp"
version = "0.3.10"
edition = "2024"
license = "AGPL-3.0-only"
description = "MCP server for cc-gnothi: Claude Code self-knowledge system"
repository = "https://github.com/MyLittleLuckyDog/cc-gnothi"
build = "build.rs"

[features]
# Default build: only spec .md files. Public release artifact.
default = []
# Full build: also embed prompt-body dumps from
# ../../caludeCodeAVX2/prompts/v*/{cmd}.txt (private repo). Use this
# build locally or for private distribution — do not ship as a public
# release asset, the carried text is © Anthropic PBC.
full = []

[dependencies]
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "1.0", features = ["derive"] }
walkdir = "2"
anyhow = "1"
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# self-update
flate2 = "1"
tar = "0.4"
fs2 = "0.4"
dirs = "5"
