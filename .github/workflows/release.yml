name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon runner
            target: aarch64-apple-darwin
            artifact: cc-gnothi-mcp
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cc-gnothi-mcp
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cc-gnothi-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cc-gnothi-mcp.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --manifest-path src/Cargo.toml --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN="src/target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          ARCHIVE="cc-gnothi-mcp-${{ github.ref_name }}-${{ matrix.target }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "$BIN" "${ARCHIVE}.exe"
            echo "ASSET=${ARCHIVE}.exe" >> $GITHUB_ENV
          else
            tar czf "${ARCHIVE}.tar.gz" -C "$(dirname $BIN)" "$(basename $BIN)"
            echo "ASSET=${ARCHIVE}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
